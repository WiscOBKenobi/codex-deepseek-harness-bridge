<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1370" viewBox="0 0 1440 1370" role="img" aria-labelledby="title desc">
  <title id="title">Codex and DeepSeek Harness architecture</title>
  <desc id="desc">Codex plans and reviews through MCP. A local daemon owns the queue, supervision, and persistence. Official Harness headless runs DeepSeek tasks. Files mode restricts tools; native agent is opt-in. Output returns for independent review. The optional dashboard can submit directly without Codex planning.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9z" fill="#506785"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9z" fill="#2463CB"/></marker>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#18304F}
      .heading{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.muted{fill:#526880}.label{font-size:17px;fill:#526880}
      .box{fill:white;stroke:#C9D5E5;stroke-width:2}.blue{fill:#EDF4FF;stroke:#8CB4EE;stroke-width:2}.green{fill:#EDF8F2;stroke:#A2D2B7;stroke-width:2}.optional{fill:#FFF;stroke:#AAB8CC;stroke-width:2;stroke-dasharray:8 6}
      .line{fill:none;stroke:#506785;stroke-width:2.5;marker-end:url(#arrow)}.both{fill:none;stroke:#2463CB;stroke-width:2.5;marker-start:url(#blueArrow);marker-end:url(#blueArrow)}.dash{fill:none;stroke:#71839A;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1370" fill="#F6F8FC"/>
  <text x="70" y="63" font-size="34" font-weight="700">Codex × DeepSeek Harness</text>
  <text x="70" y="100" class="body muted">Codex plans and reviews · DeepSeek executes · Local daemon owns tasks</text>

  <path class="line" d="M310 195 H400"/>
  <path class="dash" d="M200 150 V125 H1200 V150"/>
  <path class="both" d="M645 265 V330"/>
  <path class="both" d="M645 425 V500"/>
  <path class="dash" d="M1200 300 V585 H1030"/>
  <path class="both" d="M645 690 V765"/>
  <path class="both" d="M1030 835 H1090"/>
  <path class="both" d="M645 940 V1020"/>
  <path class="dash" d="M235 832 H250"/>

  <rect x="70" y="150" width="240" height="100" rx="16" class="box"/>
  <text x="190" y="194" text-anchor="middle" class="heading">User</text>
  <text x="190" y="229" text-anchor="middle" class="body muted">Goal, scope, acceptance</text>

  <rect x="400" y="150" width="490" height="115" rx="16" class="blue"/>
  <text x="645" y="190" text-anchor="middle" class="heading">Codex · Your selected model</text>
  <text x="645" y="225" text-anchor="middle" class="body">Plan / Delegate / Verify / Integrate</text>
  <text x="930" y="232" class="small muted">Primary</text>

  <rect x="1040" y="150" width="330" height="150" rx="16" class="optional"/>
  <text x="1205" y="188" text-anchor="middle" class="body">Optional dashboard (Chinese)</text>
  <text x="1205" y="224" text-anchor="middle" class="body">Monitor or submit directly</text>
  <text x="1205" y="257" text-anchor="middle" class="small muted">Direct tasks bypass Codex</text>
  <text x="1205" y="283" text-anchor="middle" class="small muted">planning and review</text>

  <rect x="400" y="330" width="490" height="95" rx="16" class="blue"/>
  <text x="645" y="368" text-anchor="middle" class="heading">MCP server · 7 tools</text>
  <text x="645" y="404" text-anchor="middle" class="small muted">Submit / Query / Read / Continue / Cancel / List / Review</text>
  <text x="680" y="468" class="label">Authenticated RPC · State and artifacts</text>

  <rect x="250" y="500" width="780" height="190" rx="20" class="box"/>
  <text x="280" y="540" class="heading">Local daemon · Tasks survive client disconnect</text>
  <rect x="278" y="562" width="222" height="100" rx="12" fill="#EEF2F8"/>
  <text x="389" y="596" text-anchor="middle" class="body">Queue / Continue / Cancel</text>
  <text x="389" y="625" text-anchor="middle" class="small muted">Atomic state / Recovery</text>
  <text x="389" y="651" text-anchor="middle" class="small muted">Execution ≠ Acceptance</text>
  <rect x="513" y="562" width="235" height="100" rx="12" fill="#EEF2F8"/>
  <text x="630" y="596" text-anchor="middle" class="body">Heartbeat / Progress</text>
  <text x="630" y="625" text-anchor="middle" class="small muted">15 s heartbeat ≠ Progress</text>
  <text x="630" y="651" text-anchor="middle" class="small muted">300 s idle: warn only</text>
  <rect x="762" y="562" width="240" height="100" rx="12" fill="#EEF2F8"/>
  <text x="882" y="596" text-anchor="middle" class="body">Artifacts / Review</text>
  <text x="882" y="625" text-anchor="middle" class="small muted">Manifest / Bounded reads</text>
  <text x="882" y="651" text-anchor="middle" class="small muted">Codex checks actual files</text>
  <text x="680" y="730" class="label">One process per run · 0 = No duration / tool-count cutoff</text>

  <rect x="250" y="765" width="780" height="175" rx="20" class="green"/>
  <text x="280" y="805" class="heading">External DeepSeek Harness · Official headless</text>
  <text x="280" y="837" class="body muted">Agent loop / Provider / Sessions / Tools and plugins</text>
  <rect x="278" y="855" width="350" height="60" rx="10" fill="#FFF"/>
  <text x="453" y="881" text-anchor="middle" class="body">agent · Explicit opt-in</text>
  <text x="453" y="906" text-anchor="middle" class="small muted">Commands, dependencies, tests as configured</text>
  <rect x="644" y="855" width="358" height="60" rx="10" fill="#FFF"/>
  <text x="823" y="881" text-anchor="middle" class="body">files · Distribution default</text>
  <text x="823" y="906" text-anchor="middle" class="small muted">read / write / edit with path guards</text>

  <rect x="55" y="785" width="180" height="100" rx="12" class="box"/>
  <text x="145" y="819" text-anchor="middle" class="small">Harness credentials</text>
  <text x="145" y="850" text-anchor="middle" class="small muted">Key stays in Harness</text>
  <text x="145" y="874" text-anchor="middle" class="small muted">Not passed via MCP</text>

  <rect x="1090" y="770" width="280" height="135" rx="16" class="green"/>
  <text x="1230" y="807" text-anchor="middle" class="heading">DeepSeek API</text>
  <text x="1230" y="839" text-anchor="middle" class="small">deepseek-official</text>
  <text x="1230" y="867" text-anchor="middle" class="small">deepseek-flash / max</text>
  <text x="1230" y="893" text-anchor="middle" class="small muted">Separate API billing</text>
  <text x="680" y="983" class="label">Input copies → Task workspace → Output delivery</text>

  <rect x="250" y="1020" width="780" height="175" rx="20" class="box"/>
  <text x="280" y="1060" class="heading">Independent task workspace</text>
  <rect x="278" y="1082" width="205" height="80" rx="12" fill="#EEF2F8"/>
  <text x="380" y="1114" text-anchor="middle" class="body">input</text>
  <text x="380" y="1145" text-anchor="middle" class="small muted">Explicit file copies</text>
  <path class="line" d="M484 1122 H521"/>
  <rect x="524" y="1082" width="219" height="80" rx="12" fill="#EEF2F8"/>
  <text x="633" y="1114" text-anchor="middle" class="body">Agent project / Scratch</text>
  <text x="633" y="1145" text-anchor="middle" class="small muted">Dependencies / Code / Tests</text>
  <path class="line" d="M744 1122 H781"/>
  <rect x="784" y="1082" width="218" height="80" rx="12" fill="#EDF4FF"/>
  <text x="893" y="1114" text-anchor="middle" class="body">output</text>
  <text x="893" y="1145" text-anchor="middle" class="small muted">Manifest / Hashes / Files</text>

  <rect x="1090" y="1000" width="280" height="208" rx="16" fill="#FFF7E9" stroke="#E3CC9E" stroke-width="2"/>
  <text x="1110" y="1037" class="heading">Runtime limits</text>
  <text x="1110" y="1072" class="small">Partial Windows confinement</text>
  <text x="1110" y="1102" class="small">No automatic human approvals</text>
  <text x="1110" y="1132" class="small">No execution during sleep/off</text>
  <text x="1110" y="1162" class="small">Explicit resume after interruption</text>
  <text x="1110" y="1192" class="small">No wakeup of ended Codex turns</text>

  <rect x="70" y="1250" width="1300" height="76" rx="14" fill="#E9EEF6"/>
  <text x="95" y="1282" class="body">Execution complete ≠ Review accepted. Outputs are not automatically applied to the source project.</text>
  <text x="95" y="1310" class="small muted">No extra Codex / OpenAI API layer. Distribution excludes external Harness, credentials, and local task data.</text>
</svg>
