<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1370" viewBox="0 0 1440 1370" role="img" aria-labelledby="title desc">
  <title id="title">Codex 与 DeepSeek Harness 完整架构</title>
  <desc id="desc">用户通过 Codex 所选模型规划任务，经 MCP 连接本机 daemon。后台服务负责队列、监督和持久化，调用外部 Harness 原生 headless 及 DeepSeek API。files 默认限制文件工具，agent 显式启用原生工具，在独立任务工作目录执行，交付 output 返回 Codex 独立验收。可选网页可以监控或直接提交，直接提交不经过 Codex 自动规划和验收。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9z" fill="#506785"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9z" fill="#2463CB"/></marker>
    <style>
      text{font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#18304F}
      .heading{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.muted{fill:#526880}.label{font-size:19px;fill:#526880}
      .box{fill:white;stroke:#C9D5E5;stroke-width:2}.blue{fill:#EDF4FF;stroke:#8CB4EE;stroke-width:2}.green{fill:#EDF8F2;stroke:#A2D2B7;stroke-width:2}.optional{fill:#FFF;stroke:#AAB8CC;stroke-width:2;stroke-dasharray:8 6}
      .line{fill:none;stroke:#506785;stroke-width:2.5;marker-end:url(#arrow)}.both{fill:none;stroke:#2463CB;stroke-width:2.5;marker-start:url(#blueArrow);marker-end:url(#blueArrow)}.dash{fill:none;stroke:#71839A;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1370" fill="#F6F8FC"/>
  <text x="70" y="63" font-size="34" font-weight="700">Codex × DeepSeek Harness</text>
  <text x="70" y="100" class="body muted">Codex 规划与验收 · DeepSeek 独立执行 · 本机服务持续持有任务</text>

  <path class="line" d="M310 195 H400"/>
  <path class="dash" d="M200 150 V125 H1200 V150"/>
  <path class="both" d="M645 265 V330"/>
  <path class="both" d="M645 425 V500"/>
  <path class="dash" d="M1200 300 V585 H1030"/>
  <path class="both" d="M645 690 V765"/>
  <path class="both" d="M1030 835 H1090"/>
  <path class="both" d="M645 940 V1020"/>
  <path class="dash" d="M235 832 H250"/>

  <rect x="70" y="150" width="240" height="100" rx="16" class="box"/>
  <text x="190" y="194" text-anchor="middle" class="heading">用户</text>
  <text x="190" y="229" text-anchor="middle" class="body muted">目标、范围、验收标准</text>

  <rect x="400" y="150" width="490" height="115" rx="16" class="blue"/>
  <text x="645" y="190" text-anchor="middle" class="heading">Codex · 用户已选模型</text>
  <text x="645" y="225" text-anchor="middle" class="body">规划 / 分工 / 独立检查 / 整合交付</text>
  <text x="930" y="232" class="small muted">主入口</text>

  <rect x="1040" y="150" width="330" height="150" rx="16" class="optional"/>
  <text x="1205" y="188" text-anchor="middle" class="heading">可选中文面板</text>
  <text x="1205" y="224" text-anchor="middle" class="body">监控或手动直接提交</text>
  <text x="1205" y="257" text-anchor="middle" class="small muted">直接任务不经过 Codex</text>
  <text x="1205" y="283" text-anchor="middle" class="small muted">自动规划与验收</text>

  <rect x="400" y="330" width="490" height="95" rx="16" class="blue"/>
  <text x="645" y="368" text-anchor="middle" class="heading">MCP server · 7 个工具</text>
  <text x="645" y="404" text-anchor="middle" class="body muted">提交 / 查询 / 读取 / 继续 / 取消 / 列表 / 验收</text>
  <text x="680" y="468" class="label">认证 RPC · 状态与产物双向传递</text>

  <rect x="250" y="500" width="780" height="190" rx="20" class="box"/>
  <text x="280" y="540" class="heading">本地 daemon · 客户端断开不停止任务</text>
  <rect x="278" y="562" width="222" height="100" rx="12" fill="#EEF2F8"/>
  <text x="389" y="596" text-anchor="middle" class="body">串行队列 / 继续 / 取消</text>
  <text x="389" y="625" text-anchor="middle" class="small muted">原子持久化与中断恢复</text>
  <text x="389" y="651" text-anchor="middle" class="small muted">运行 ≠ 验收</text>
  <rect x="513" y="562" width="235" height="100" rx="12" fill="#EEF2F8"/>
  <text x="630" y="596" text-anchor="middle" class="body">监督心跳 / 独立进展</text>
  <text x="630" y="625" text-anchor="middle" class="small muted">15 秒心跳不等于进展</text>
  <text x="630" y="651" text-anchor="middle" class="small muted">300 秒无进展仅提示</text>
  <rect x="762" y="562" width="240" height="100" rx="12" fill="#EEF2F8"/>
  <text x="882" y="596" text-anchor="middle" class="body">结果收集 / 验收记录</text>
  <text x="882" y="625" text-anchor="middle" class="small muted">output 清单与有限读取</text>
  <text x="882" y="651" text-anchor="middle" class="small muted">实际文件回到 Codex 检查</text>
  <text x="680" y="730" class="label">每轮独立进程 · 0 表示无桥接时长 / 次数截止</text>

  <rect x="250" y="765" width="780" height="175" rx="20" class="green"/>
  <text x="280" y="805" class="heading">外部 DeepSeek Harness · 官方 headless</text>
  <text x="280" y="837" class="body muted">原生代理循环 / 模型适配 / 会话 / 工具与插件</text>
  <rect x="278" y="855" width="350" height="60" rx="10" fill="#FFF"/>
  <text x="453" y="881" text-anchor="middle" class="body">agent · 显式启用</text>
  <text x="453" y="906" text-anchor="middle" class="small muted">命令、依赖、测试等依配置可用</text>
  <rect x="644" y="855" width="358" height="60" rx="10" fill="#FFF"/>
  <text x="823" y="881" text-anchor="middle" class="body">files · 发布默认</text>
  <text x="823" y="906" text-anchor="middle" class="small muted">read / write / edit 与路径守卫</text>

  <rect x="55" y="785" width="180" height="100" rx="12" class="box"/>
  <text x="145" y="819" text-anchor="middle" class="small">已有 Harness 凭据</text>
  <text x="145" y="850" text-anchor="middle" class="small muted">Key 不经 MCP</text>
  <text x="145" y="874" text-anchor="middle" class="small muted">读取或传递</text>

  <rect x="1090" y="770" width="280" height="135" rx="16" class="green"/>
  <text x="1230" y="807" text-anchor="middle" class="heading">DeepSeek API</text>
  <text x="1230" y="839" text-anchor="middle" class="small">deepseek-official</text>
  <text x="1230" y="867" text-anchor="middle" class="small">deepseek-flash / max</text>
  <text x="1230" y="893" text-anchor="middle" class="small muted">独立计费</text>
  <text x="680" y="983" class="label">输入副本 → 任务工作 → output 交付</text>

  <rect x="250" y="1020" width="780" height="175" rx="20" class="box"/>
  <text x="280" y="1060" class="heading">独立任务 workspace</text>
  <rect x="278" y="1082" width="205" height="80" rx="12" fill="#EEF2F8"/>
  <text x="380" y="1114" text-anchor="middle" class="body">input</text>
  <text x="380" y="1145" text-anchor="middle" class="small muted">明确文件副本</text>
  <path class="line" d="M484 1122 H521"/>
  <rect x="524" y="1082" width="219" height="80" rx="12" fill="#EEF2F8"/>
  <text x="633" y="1114" text-anchor="middle" class="body">agent 工程与临时文件</text>
  <text x="633" y="1145" text-anchor="middle" class="small muted">依赖 / 源码 / 测试</text>
  <path class="line" d="M744 1122 H781"/>
  <rect x="784" y="1082" width="218" height="80" rx="12" fill="#EDF4FF"/>
  <text x="893" y="1114" text-anchor="middle" class="body">output</text>
  <text x="893" y="1145" text-anchor="middle" class="small muted">清单 / 摘要 / 成果文件</text>

  <rect x="1090" y="1000" width="280" height="208" rx="16" fill="#FFF7E9" stroke="#E3CC9E" stroke-width="2"/>
  <text x="1110" y="1037" class="heading">运行边界</text>
  <text x="1110" y="1072" class="small">Windows 仅部分系统隔离</text>
  <text x="1110" y="1102" class="small">人工权限请求不会自动批准</text>
  <text x="1110" y="1132" class="small">关机或休眠不能继续执行</text>
  <text x="1110" y="1162" class="small">异常恢复后明确续办</text>
  <text x="1110" y="1192" class="small">不主动唤醒已结束 Codex 回合</text>

  <rect x="70" y="1250" width="1300" height="76" rx="14" fill="#E9EEF6"/>
  <text x="95" y="1282" class="body">运行完成 ≠ 验收通过；产物不会自动应用到原项目。</text>
  <text x="95" y="1310" class="small muted">不增加额外 Codex / OpenAI API 层。源码分发不含外部 Harness、凭据或本机任务数据。</text>
</svg>
